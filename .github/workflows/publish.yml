name: Publish NORTH

# Three-hourly, plus on demand and on every push to main.
#
# The schedule is what makes this worth having: it runs on GitHub's machines, so the
# site refreshes whether or not anyone's laptop is open. Seventeen minutes past is
# deliberate — scheduled jobs everywhere cluster on the hour, and the sources are politer
# to a request that does not arrive with everyone else's.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# One deployment at a time. A queued run is pointless when a newer one is behind it, but
# cancelling one mid-deploy would leave Pages half-updated, so in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # PGlite is real PostgreSQL compiled to WASM, so the whole pipeline runs here with
      # no database service to provision. It is single-connection and slow under load,
      # which is fine: nothing else is using it.
      - name: Start the database
        run: |
          # Output redirected to a file, not inherited. A background process holding the
          # step's stdout open is a step that never finishes, and the log gives no clue
          # why — the runner is simply waiting on a pipe nobody will close.
          nohup npm run db:up > /tmp/pglite.log 2>&1 &
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 55432 && break
            sleep 2
          done
          if ! nc -z 127.0.0.1 55432; then
            echo "database never came up; last output:"
            cat /tmp/pglite.log
            exit 1
          fi
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres
          # Next renders pages and route handlers as separate module instances, each with
          # its own client. One connection means the second evicts the first.
          PGLITE_MAX_CONNECTIONS: '20'

      - name: Create the schema and reference data
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres

      # Company financials from SEC EDGAR: revenue, growth, margin and public float for
      # the US filers among the tracked companies, straight from the annual filings.
      # Never estimated — a company with no clean annual figure keeps an empty profile.
      - name: Fetch company financials
        run: npm run build:edgar
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres
          # SEC refuses a User-Agent without a contact email. Held as a secret so the
          # address is not published in a public repository; the step skips with a
          # visible warning when it is unset rather than silently doing nothing.
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

      # Fetches the sources. This is the step that makes the published site current, and
      # the only one that touches the network on purpose.
      - name: Ingest
        run: npm run pipeline
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres

      # Fails the build rather than publishing something that violates them. A site that
      # is merely stale is a nuisance; one that shows an unevidenced claim is a lie.
      - name: Check the evidence invariants
        run: npm run eval
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres

      - name: Build the site
        run: npm run build:static
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres
          STATIC_EXPORT: '1'
          # A project site serves from /<repo>. Left empty for a user or organisation
          # site at the root; the workflow works out which this is.
          # Absolute URLs are mandatory in a feed: a reader has no page to resolve
          # against. Derived from the same repository name as BASE_PATH.
          SITE_URL: https://${{ github.repository_owner }}.github.io${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}

      # Uploaded as an artifact rather than committed. The output is ~130 MB and changes
      # substantially every three hours; committing it would make the repository
      # unusable within a week.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
