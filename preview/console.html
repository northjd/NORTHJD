<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Intelligence OS</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Operator console, not a document.

   The previous design read as a well-typeset report: card lists, generous
   whitespace, everything centred in a column. This is the same information as a
   working surface — persistent sidebar, master-detail so you never navigate away,
   real tables, actual charts, dense rows, keyboard-first, a status bar that tells
   you the state of the system.

   Dark-first, because that is what these tools are used in all day.
   ═══════════════════════════════════════════════════════════════════════════ */

:root[data-theme=dark]{
  /* Grayscale first. One accent, used only for the active state and for data —
     never for decoration. The semantic colours are desaturated hard so that a
     coloured element on screen always means something. */
  --bg:#0a0a0b; --pane:#0e0e10; --pane-2:#101013; --raise:#16161a; --inset:#17171b;
  --line:#1e1e22; --line-2:#2a2a30; --line-3:#3a3a42;
  --fg:#f2f2f4; --fg-2:#a1a1a8; --fg-3:#70707a; --fg-4:#4e4e57;
  --accent:#f2f2f4; --accent-2:#c9c9d0; --accent-dim:#1c1c21; --accent-line:#33333c;
  --ok:#6fae8f; --ok-dim:#141b17;
  --warn:#c79a5a; --warn-dim:#1e1a13;
  --bad:#c8756c; --bad-dim:#1f1514;
  --data:#8fa5c9;
  --grid:rgba(255,255,255,.02);
}
:root[data-theme=light]{
  --bg:#fbfbfa; --pane:#fff; --pane-2:#f7f7f6; --raise:#fff; --inset:#f0f0ee;
  --line:#e6e6e3; --line-2:#d4d4d0; --line-3:#b4b4ae;
  --fg:#0d0d0e; --fg-2:#55555c; --fg-3:#78787f; --fg-4:#a0a0a6;
  --accent:#0d0d0e; --accent-2:#33333a; --accent-dim:#f0f0ee; --accent-line:#cfcfca;
  --ok:#3d7a5c; --ok-dim:#e9f1ec;
  --warn:#8a6224; --warn-dim:#f6efe3;
  --bad:#a24b42; --bad-dim:#f7eae8;
  --data:#41567a;
  --grid:rgba(0,0,0,.018);
}
:root{--brand:var(--accent);--brand-2:var(--accent-2);
  --brand-dim:var(--accent-dim);--brand-line:var(--accent-line)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font:13px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:'cv02','cv03','ss01','tnum'}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
::selection{background:var(--brand-dim);color:var(--brand-2)}
:focus-visible{outline:1.5px solid var(--brand);outline-offset:1px;border-radius:4px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid transparent;
  background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ── Frame ─────────────────────────────────────────────────────────────── */
.app{display:grid;height:100dvh;
  grid-template-columns:var(--sbw,228px) minmax(0,1fr);
  grid-template-rows:44px auto minmax(0,1fr) 27px;
  grid-template-areas:"side bar" "side filt" "side main" "side status"}
.app[data-collapsed=true]{--sbw:52px}

/* ── Sidebar ───────────────────────────────────────────────────────────── */
.side{grid-area:side;background:var(--pane);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.brand{height:44px;display:flex;align-items:center;gap:9px;padding:0 12px;flex:0 0 auto;
  border-bottom:1px solid var(--line)}
.logo{width:20px;height:20px;border-radius:4px;flex:0 0 auto;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:var(--bg);letter-spacing:-.02em;background:var(--accent)}
.brand b{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  white-space:nowrap;color:var(--fg-2)}
[data-collapsed=true] .brand b,[data-collapsed=true] .navtext,
[data-collapsed=true] .sgroup>.slabel,[data-collapsed=true] .savedbox{display:none}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.sgroup{padding:0 0 6px}
.sgroup>.slabel{font-size:9px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;
  color:var(--fg-4);padding:11px 14px 6px}
.nitem{display:flex;align-items:center;gap:9px;height:28px;padding:0 12px;margin:0 6px;
  border-radius:6px;color:var(--fg-2);font-size:12.5px;font-weight:480;
  transition:background .12s,color .12s;position:relative}
.nitem:hover{background:var(--inset);color:var(--fg)}
.nitem.on{background:var(--inset);color:var(--fg);font-weight:560}
.nitem.on::before{content:'';position:absolute;left:-6px;top:6px;bottom:6px;width:2px;
  background:var(--accent);border-radius:0 2px 2px 0}
.nitem .ic{width:15px;text-align:center;font-size:12px;flex:0 0 auto;opacity:.85}
.nitem .kbd{margin-left:auto;font-size:9.5px;color:var(--fg-4);letter-spacing:.02em}
.nitem .pill{margin-left:auto;font-size:9.5px;padding:1px 5px;border-radius:9px;
  background:var(--inset);color:var(--fg-3)}
.nitem.on .pill{background:var(--accent);color:var(--bg)}
.savedbox{padding:4px 6px 10px}
.saved{display:flex;align-items:center;gap:7px;height:25px;padding:0 8px;border-radius:5px;
  font-size:11.5px;color:var(--fg-3);width:100%;text-align:left}
.saved:hover{background:var(--inset);color:var(--fg-2)}
.saved .dot{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.saved .n{margin-left:auto;font-size:10px;color:var(--fg-4)}
.sfoot{flex:0 0 auto;border-top:1px solid var(--line);padding:7px 6px}

/* ── Top bar ───────────────────────────────────────────────────────────── */
.bar{grid-area:bar;background:var(--pane-2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:0 12px}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-3);flex:0 0 auto}
.crumb b{color:var(--fg);font-weight:560}
.crumb .sep{color:var(--fg-4)}
.cmd{flex:1 1 180px;min-width:0;max-width:520px;display:flex;align-items:center;gap:8px;height:28px;
  white-space:nowrap;overflow:hidden;
  padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);
  color:var(--fg-3);font-size:12.5px;transition:border-color .14s,background .14s}
.cmd:hover{border-color:var(--line-3);background:var(--pane)}
.cmd .kbd{margin-left:auto;font-size:10px;padding:1px 5px;border-radius:4px;
  border:1px solid var(--line-2);color:var(--fg-4)}
.barr{margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;border-radius:6px;
  font-size:11px;font-weight:500;border:1px solid var(--line);color:var(--fg-2);background:var(--bg)}
.chip .dot{width:6px;height:6px;border-radius:50%}
.iconb{width:27px;height:27px;border-radius:6px;display:grid;place-items:center;color:var(--fg-3);
  font-size:13px}
.iconb:hover{background:var(--inset);color:var(--fg)}

/* ── Filter bar — the primary control surface ──────────────────────────
   Promoted out of a sidebar and given its own row in the grid. Narrowing the
   corpus is the main thing a user does here, so it gets the space; the corpus
   statistics that used to sit in the header have moved to the footer, where a
   number you glance at twice a week belongs. */
.filt{grid-area:filt;background:var(--pane);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:5px;padding:7px 11px;flex-wrap:wrap;
  min-height:41px}
.fgroup{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 9px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--bg);font-size:12px;font-weight:500;
  color:var(--fg-2);transition:border-color .13s,color .13s,background .13s}
.fbtn:hover{border-color:var(--line-3);color:var(--fg)}
.fbtn.act{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:560}
.fbtn .cv{font-size:9.5px;padding:0 4px;height:14px;border-radius:7px;display:grid;place-items:center;
  background:var(--bg);color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.fbtn .car{font-size:8px;opacity:.5}
.fpop{position:absolute;top:calc(100% + 5px);left:0;z-index:70;min-width:236px;max-width:320px;
  background:var(--pane);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:0 18px 44px -14px rgb(0 0 0/.6);overflow:hidden;
  animation:pop .13s cubic-bezier(.2,.85,.3,1)}
.fpop .hd{padding:9px 11px 6px;font-size:8.5px;text-transform:uppercase;letter-spacing:.17em;
  font-weight:700;color:var(--fg-4);border-bottom:1px solid var(--line)}
.fsearch{display:flex;align-items:center;gap:7px;padding:7px 11px;border-bottom:1px solid var(--line)}
.fsearch input{flex:1;background:none;border:0;outline:0;font-size:12.5px;color:var(--fg)}
.fsearch input::placeholder{color:var(--fg-4)}
.fsearch .ic{font-size:11px;color:var(--fg-4)}
.fnote{padding:8px 11px;font-size:10.5px;line-height:1.5;color:var(--fg-3);
  border-top:1px solid var(--line)}
/* Wider panel for the precise taxonomy — several dimensions at once. */
.morepop{position:fixed;z-index:70;width:min(680px,calc(100vw - 24px));
  background:var(--pane);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:0 18px 44px -14px rgb(0 0 0/.6);padding:4px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px;
  animation:pop .13s cubic-bezier(.2,.85,.3,1);max-height:74vh;overflow-y:auto}
.morecol{padding:6px 4px}
.morecol .hd{font-size:8.5px;text-transform:uppercase;letter-spacing:.17em;font-weight:700;
  color:var(--fg-4);padding:5px 8px 6px}
.fpop .bd{max-height:270px;overflow-y:auto;padding:4px}
.fopt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;width:100%;
  text-align:left;font-size:12px;color:var(--fg-2);cursor:pointer}
.fopt:hover{background:var(--inset);color:var(--fg)}
.fopt .bx{width:13px;height:13px;border-radius:3.5px;border:1.5px solid var(--line-3);flex:0 0 auto;
  display:grid;place-items:center;font-size:9px;color:#fff}
.fopt[aria-checked=true] .bx{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.fopt[aria-checked=true]{color:var(--fg);font-weight:520}
.fopt .n{margin-left:auto;font-size:10.5px;color:var(--fg-4);font-variant-numeric:tabular-nums}
.fopt[data-zero=true]{opacity:.42}
.fpop .ft{border-top:1px solid var(--line);padding:6px 9px;display:flex;gap:9px;font-size:10.5px}
.fpop .ft button{color:var(--brand-2);font-weight:550}
.fsep{width:1px;height:19px;background:var(--line);margin:0 3px;flex:0 0 auto}
.fclear{height:27px;padding:0 9px;border-radius:7px;font-size:11.5px;color:var(--fg-3);font-weight:520}
.fclear:hover{color:var(--bad);background:var(--bad-dim)}
.fcount{font-size:11.5px;color:var(--fg-3);margin-left:auto;padding-right:2px;white-space:nowrap}
.fcount b{color:var(--fg);font-variant-numeric:tabular-nums}
.fcount .of{color:var(--fg-4)}

/* ── Main: master–detail ───────────────────────────────────────────────── */
.main{grid-area:main;display:grid;grid-template-columns:minmax(340px,var(--listw,46%)) minmax(0,1fr);
  overflow:hidden;background:var(--bg)}
.main[data-solo=true]{grid-template-columns:minmax(0,1fr)}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;
  background:var(--pane)}
.detail{overflow-y:auto;background:var(--bg)}
@media(max-width:940px){
  .main{grid-template-columns:minmax(0,1fr)}
  .detail{display:none}
  .main[data-open=true] .list{display:none}
  .main[data-open=true] .detail{display:block}
}

/* toolbar above the list */
.ltool{flex:0 0 auto;height:34px;display:flex;align-items:center;gap:8px;padding:0 11px;
  border-bottom:1px solid var(--line);background:var(--pane-2)}
.ltool .cnt{font-size:11.5px;color:var(--fg-3)}
.ltool .cnt b{color:var(--fg)}
/* When the window was widened, say so where the count is — not in a toast that vanishes. */
.ltool .widen{font-size:10px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);
  padding:1px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;margin-left:auto}
.seg button{height:22px;padding:0 9px;font-size:11px;font-weight:520;color:var(--fg-3)}
.seg button.on{background:var(--brand);color:#fff}
.sortsel{height:23px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);
  font-size:11.5px;padding:0 6px;color:var(--fg-2)}

.rows{flex:1;overflow-y:auto}

/* row — dense, one line of substance plus one of metadata */
.row{display:grid;grid-template-columns:2px 30px 1fr;gap:0;
  border-bottom:1px solid var(--line);cursor:pointer;position:relative;
  transition:background .14s ease}
.row:hover{background:var(--pane-2)}
.row.on{background:var(--inset)}
.row .edge{background:transparent}
.row[data-ev=strong] .edge{background:var(--ok)}
.row[data-ev=weak] .edge{background:var(--warn)}
.row.on .edge{background:var(--accent)}
/* 01, 02, 03 … — orientation in a long list, and the anchor for j/k navigation. */
.rnum{padding:10px 0 0;text-align:center;font-family:ui-monospace,'SF Mono',Menlo,monospace;
  font-size:9.5px;letter-spacing:.04em;color:var(--fg-4);font-variant-numeric:tabular-nums;
  user-select:none}
.row.on .rnum{color:var(--accent)}
.rbody{padding:8px 12px 10px 2px;min-width:0}
.rtop{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.rtitle{font-size:13.2px;line-height:1.34;font-weight:520;letter-spacing:-.012em;color:var(--fg);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.on .rtitle{color:var(--brand-2)}
.rmeta{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--fg-3);margin-top:5px;
  flex-wrap:wrap;letter-spacing:.02em}
.rmeta .co{color:var(--fg-2);font-weight:500}
.racts{position:absolute;right:8px;top:7px;display:none;gap:3px}
.row:hover .racts{display:flex}
.racts button{width:23px;height:23px;border-radius:5px;background:var(--raise);
  border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;color:var(--fg-3)}
.racts button:hover{color:var(--brand-2);border-color:var(--brand-line)}

/* table mode */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
thead th{position:sticky;top:0;z-index:1;background:var(--pane);text-align:left;
  font-size:8.5px;text-transform:uppercase;letter-spacing:.17em;font-weight:700;color:var(--fg-4);
  padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;
  user-select:none}
thead th:hover{color:var(--fg-2)}
thead th .ar{opacity:.5;font-size:9px}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--pane-2)}
tbody tr.on{background:var(--inset)}
td.tt{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;
  color:var(--fg)}

/* ── Badges ────────────────────────────────────────────────────────────── */
.b{display:inline-flex;align-items:center;gap:3px;height:16px;padding:0 5px;border-radius:3px;
  font-size:9px;font-weight:650;letter-spacing:.055em;text-transform:uppercase;
  white-space:nowrap;border:1px solid transparent;background:none}
.b.n{color:var(--fg-3);border-color:var(--line-2)}
.b.a{color:var(--fg);border-color:var(--accent-line)}
.b.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.b.w{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent)}
.b.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.b.m{color:var(--fg-4);border-color:var(--line)}

/* ── Detail pane ───────────────────────────────────────────────────────── */
.dwrap{max-width:800px;padding:30px 34px 80px}
.dhead{margin-bottom:20px}
.dtitle{font-size:27px;line-height:1.16;letter-spacing:-.028em;font-weight:600;margin:13px 0 12px;
  text-wrap:balance}
.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.2em;font-weight:700;
  color:var(--fg-3)}
.dlede{font-size:14px;line-height:1.68;color:var(--fg-2);max-width:62ch}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  border-top:1px solid var(--line);margin:24px 0}
@media(min-width:760px){.dgrid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}}
.dcell{padding:14px 20px 15px 0;border-bottom:1px solid var(--line)}
.dcell .k{font-size:8.5px;text-transform:uppercase;letter-spacing:.17em;color:var(--fg-4);
  font-weight:700}
.dcell .v{font-size:13.5px;font-weight:500;margin-top:6px;color:var(--fg);letter-spacing:-.008em}
.sec{font-size:9px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;
  color:var(--fg-3);margin:30px 0 11px;display:flex;align-items:center;gap:12px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.blk{border-left:1px solid;padding-left:16px;margin:14px 0}
.blk.f{border-color:var(--ok)} .blk.i{border-color:var(--warn)} .blk.c{border-color:var(--bad)}
.blk .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.17em;font-weight:700;margin-bottom:7px}
.blk.f .l{color:var(--ok)} .blk.i .l{color:var(--warn)} .blk.c .l{color:var(--bad)}
.serif{font-family:'Iowan Old Style',Georgia,serif;font-size:15px;line-height:1.7;color:var(--fg);
  max-width:66ch;letter-spacing:-.003em}
.body{font-size:13px;line-height:1.65;color:var(--fg-2)}
ul,ol{margin:0;padding-left:17px}
li{margin-bottom:4px;font-size:12.5px;line-height:1.6;color:var(--fg-2)}
.excerpt{border-left:1px solid var(--line-2);padding:2px 0 2px 18px;
  font-family:'Iowan Old Style',Georgia,serif;font-size:14px;line-height:1.78;margin:12px 0}
mark{background:var(--warn-dim);color:var(--warn);padding:.1em .1em;border-radius:2px}
.dim{color:var(--fg-4)}
.empty{display:grid;place-items:center;height:100%;color:var(--fg-4);text-align:center;padding:40px}
.empty .t{font-size:13px;font-weight:550;color:var(--fg-2);margin-bottom:5px}

/* ── Charts ────────────────────────────────────────────────────────────── */
.spark{display:block}
.mixbar{display:flex;height:6px;border-radius:4px;overflow:hidden;gap:1px;margin:7px 0}
.mixbar i{display:block;transition:flex-grow .45s cubic-bezier(.3,.7,.4,1)}
.mixleg{display:grid;gap:3px;margin-top:7px}
.mixleg .r{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-3)}
.mixleg .sw{width:6px;height:6px;border-radius:2px;flex:0 0 auto}
.mixleg .v{margin-left:auto;color:var(--fg);font-weight:600}

/* ── Status bar ────────────────────────────────────────────────────────── */
.status{grid-area:status;background:var(--pane);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 11px;font-size:10.5px;color:var(--fg-3);
  overflow:hidden;white-space:nowrap}
.status>.s{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.status .right{flex:0 0 auto}
/* Hints and corpus size are the first things to go when the window narrows — they are
   the least important things on screen. */
@media(max-width:1180px){.status .hint{display:none}}
@media(max-width:1000px){.status .corpus{display:none}}
.status .s{display:inline-flex;align-items:center;gap:5px}
.status .dot{width:6px;height:6px;border-radius:50%}
.status .fchip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:9px;
  background:var(--brand-dim);color:var(--brand-2);border:1px solid var(--brand-line);
  font-size:10px;font-weight:550}
.status .fchip button{color:inherit;opacity:.7}
.status .right{margin-left:auto;display:inline-flex;gap:12px;align-items:center}

/* ── Command palette ───────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;background:rgb(4 6 10/.62);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;padding:11vh 20px 20px;
  animation:fade .13s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pal{width:100%;max-width:620px;background:var(--pane);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:0 24px 70px -18px rgb(0 0 0/.8);overflow:hidden;
  display:flex;flex-direction:column;max-height:74vh;animation:pop .17s cubic-bezier(.2,.85,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(-9px) scale(.985)}to{opacity:1;transform:none}}
.palin{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.palin input{flex:1;background:none;border:0;outline:0;font-size:14.5px;color:var(--fg)}
.palin input::placeholder{color:var(--fg-4)}
.palmode{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--brand-dim);
  color:var(--brand-2);font-weight:650;border:1px solid var(--brand-line)}
.palres{overflow-y:auto;padding:5px}
.palgrp{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;
  color:var(--fg-4);padding:8px 10px 4px}
.palrow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;
  font-size:12.5px;color:var(--fg-2);cursor:pointer}
.palrow.cur{background:var(--brand-dim);color:var(--brand-2)}
.palrow .ic{width:16px;text-align:center;opacity:.7;font-size:11px}
.palrow .sub{margin-left:auto;font-size:10.5px;color:var(--fg-4)}
.palfoot{border-top:1px solid var(--line);padding:7px 13px;font-size:10px;color:var(--fg-4);
  display:flex;gap:13px}

/* ── Ask panel — a docked pane, not a modal ────────────────────────────── */
.askpane{position:fixed;right:0;top:44px;bottom:26px;width:min(480px,100%);z-index:60;
  background:var(--pane);border-left:1px solid var(--line-2);display:flex;flex-direction:column;
  box-shadow:-16px 0 48px -20px rgb(0 0 0/.6);animation:slidein .2s cubic-bezier(.2,.85,.3,1)}
@keyframes slidein{from{transform:translateX(22px);opacity:0}to{transform:none;opacity:1}}
.askhd{flex:0 0 auto;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--line)}
.askbd{flex:1;overflow-y:auto;padding:13px}
.askft{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 12px;background:var(--pane-2)}
.modes{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.mode{height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--line-2);font-size:10.5px;
  font-weight:560;color:var(--fg-3)}
.mode.on{background:var(--brand);border-color:var(--brand);color:#fff}
.askrow{display:flex;gap:6px;align-items:flex-end}
textarea.ask{flex:1;min-height:36px;max-height:120px;padding:8px 10px;border:1px solid var(--line-2);
  border-radius:8px;background:var(--bg);resize:none;font-size:12.5px;line-height:1.5;outline:0}
textarea.ask:focus{border-color:var(--brand)}
.ib{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  border:1px solid var(--line-2);color:var(--fg-3);font-size:13px}
.ib.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.ib.pri:disabled{opacity:.35}
.ib.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.25s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgb(242 86 75/.5)}50%{box-shadow:0 0 0 7px transparent}}
.turn{margin-bottom:12px}
.turn.me{background:var(--inset);border-radius:8px;padding:8px 11px;font-size:12.5px;font-weight:510}
.ans{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--pane-2)}
.anshd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--fg-4);
  margin-bottom:9px}
sup a{color:var(--brand-2);font-weight:700;font-size:9.5px}
.fu{height:22px;padding:0 8px;border-radius:11px;border:1px solid var(--line-2);font-size:10.5px;
  color:var(--fg-3)}
.fu:hover{border-color:var(--brand);color:var(--brand-2)}
.thinking{display:flex;gap:4px;padding:10px 0}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:bo 1.05s infinite}
.thinking i:nth-child(2){animation-delay:.13s} .thinking i:nth-child(3){animation-delay:.26s}
@keyframes bo{0%,60%,100%{opacity:.25}30%{opacity:1;transform:translateY(-4px)}}
.warnstrip{margin-top:7px;font-size:10px;line-height:1.5;color:var(--warn);background:var(--warn-dim);
  border-radius:6px;padding:6px 8px}
.skel{height:54px;border-bottom:1px solid var(--line);background:
  linear-gradient(100deg,var(--pane) 20%,var(--pane-2) 40%,var(--pane) 60%);
  background-size:220% 100%;animation:sh 1.25s infinite linear}
@keyframes sh{from{background-position:180% 0}to{background-position:-40% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <nav class="side" aria-label="Main">
    <div class="brand">
      <div class="logo">M</div><b>Market Intelligence</b>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sfoot">
      <button class="nitem" id="collapse"><span class="ic">⇤</span><span class="navtext">Collapse</span></button>
      <button class="nitem" id="theme"><span class="ic">◐</span><span class="navtext">Theme</span></button>
    </div>
  </nav>

  <header class="bar">
    <div class="crumb" id="crumb"></div>
    <button class="cmd" id="cmdbtn">
      <span>⌕</span><span style="overflow:hidden;text-overflow:ellipsis">Search, filter, or ask…</span>
      <span class="kbd" style="flex:0 0 auto">⌘K</span>
    </button>
    <div class="barr" id="barr"></div>
  </header>

  <div class="filt" id="filt"></div>

  <div class="main" id="main">
    <section class="list">
      <div class="ltool" id="ltool"></div>
      <div class="rows" id="rows"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </section>
    <section class="detail" id="detail"></section>
  </div>

  <footer class="status" id="status"></footer>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o)=>(await fetch(p,o)).json();
const pretty=s=>String(s??'').replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase());
const dshort=d=>d?new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short'}).format(new Date(d)):'—';
const dfull=d=>d?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(d)):'not stated in source';
const ago=d=>{if(!d)return'never';const h=(Date.now()-new Date(d))/36e5;
  return h<1?'just now':h<24?Math.round(h)+'h ago':Math.round(h/24)+'d ago'};

/* ── Vocabulary — same enums as packages/ui ───────────────────────────── */
const MAT={ANNOUNCED:['Announced','w','Stated intent. No implementation scope given.'],
 CONCEPT:['Concept','w','Being explored; nothing built.'],
 PILOT:['Pilot','n','Bounded trial. Most pilots do not scale.'],
 LIMITED_DEPLOYMENT:['Limited','n','Live in selected locations.'],
 SCALED_DEPLOYMENT:['Scaled','a','Described as deployed across the organisation.'],
 QUANTIFIED_BUSINESS_IMPACT:['Quantified','a','A measured outcome is claimed — check who claims it.'],
 INDEPENDENTLY_VALIDATED_IMPACT:['Validated','g','A party other than the beneficiary reports it.'],
 DISCONTINUED_OR_REVERSED:['Reversed','r','Stopped or rolled back.']};
const EV={QUANTIFIED_PRIMARY_EVIDENCE:['Quantified primary','g'],
 UNQUANTIFIED_PRIMARY_EVIDENCE:['Primary','g'],
 MULTIPLE_CREDIBLE_SECONDARY_SOURCES:['Multi-source','g'],
 SINGLE_CREDIBLE_SECONDARY_SOURCE:['Single source','n'],
 COMPANY_SELF_REPORTING:['Self-reported','w'],
 WEAK_OR_UNVERIFIED_SIGNAL:['Weak','r']};
const PER={FIRST_PARTY_COMPANY:'Company',FIRST_PARTY_TECH_PROVIDER:'Vendor',
 FIRST_PARTY_CONSULTING_FIRM:'Consulting',INDEPENDENT_BUSINESS_MEDIA:'Independent',
 INDUSTRY_MEDIA:'Trade press',REGULATOR:'Regulator',PUBLIC_INSTITUTION:'Institution',
 USER_PROVIDED:'User'};
const MC={ANNOUNCED:'var(--warn)',CONCEPT:'var(--fg-4)',PILOT:'var(--brand-2)',
 LIMITED_DEPLOYMENT:'var(--brand)',SCALED_DEPLOYMENT:'var(--ok)',
 QUANTIFIED_BUSINESS_IMPACT:'var(--ok)',INDEPENDENTLY_VALIDATED_IMPACT:'var(--ok)',
 DISCONTINUED_OR_REVERSED:'var(--bad)'};
const b=(t,k='n',ti='')=>`<span class="b ${k}"${ti?` title="${esc(ti)}"`:''}>${esc(t)}</span>`;
const bM=m=>MAT[m]?b(...MAT[m]):b(pretty(m));
const bE=e=>EV[e]?b(...EV[e]):b(pretty(e));
const bP=p=>b((String(p).startsWith('FIRST_PARTY')?'◑ ':'○ ')+(PER[p]||pretty(p)),
  String(p).startsWith('FIRST_PARTY')?'w':'n',
  String(p).startsWith('FIRST_PARTY')?'Self-reported — the subject is also the source.':'Reported by a party other than the subject.');
const STRONG=new Set(['QUANTIFIED_PRIMARY_EVIDENCE','UNQUANTIFIED_PRIMARY_EVIDENCE','MULTIPLE_CREDIBLE_SECONDARY_SOURCES']);

/* ── State ────────────────────────────────────────────────────────────── */
const S={view:'today',F:{},rows:[],total:0,sel:null,mode:'rows',sort:'date',popQ:{},entityOpts:[],
  facets:{},stats:{},health:{},mix:{},series:[],profile:null,palette:null,suggest:[]};

const NAV=[
 {g:'Intelligence',items:[
  {v:'today',ic:'◎',label:'Today',kbd:'1'},
  {v:'watch',ic:'◇',label:'Watch',kbd:'2'},
  {v:'explore',ic:'⊞',label:'Explore',kbd:'3'}]},
 {g:'Practice',items:[
  {v:'account',ic:'◆',label:'My client',kbd:'4'},
  {v:'learn',ic:'▤',label:'Learn',kbd:'5'},
  {v:'prepare',ic:'◈',label:'Prepare',kbd:'6'},
  {v:'library',ic:'▢',label:'Library',kbd:'7'}]},
 {g:'System',items:[
  {v:'sources',ic:'⚙',label:'Sources'}]},
];

function renderNav(){
  const n=$('#nav'); n.innerHTML='';
  NAV.forEach(g=>{
    const box=el('div','sgroup');
    box.append(el('div','slabel',g.g));
    g.items.forEach(it=>{
      const a=el('button','nitem'+(S.view===it.v?' on':''),
        `<span class="ic">${it.ic}</span><span class="navtext">${it.label}</span>
         ${it.kbd?`<span class="kbd navtext">${it.kbd}</span>`:''}`);
      a.onclick=()=>go(it.v);
      box.append(a);
    });
    n.append(box);
  });
  // Saved / suggested filters live in the sidebar, where a platform puts them.
  if(S.suggest.length){
    const box=el('div','sgroup');
    box.append(el('div','slabel','Saved views'));
    const wrap=el('div','savedbox');
    S.suggest.forEach(s=>{
      const on=Object.entries(s.set).every(([k,v])=>S.F[k]===v);
      const btn=el('button','saved',
        `<span class="dot" style="background:${on?'var(--brand)':'var(--line-3)'}"></span>
         <span>${esc(s.name)}</span><span class="n">${s.count??''}</span>`);
      btn.onclick=()=>{
        if(on)Object.keys(s.set).forEach(k=>delete S.F[k]);
        else Object.assign(S.F,s.set);
        go('explore');
      };
      wrap.append(btn);
    });
    box.append(wrap); n.append(box);
  }
}

/* ── Charts ───────────────────────────────────────────────────────────── */
function sparkline(data,w=104,h=18){
  if(!data.length)return '';
  const max=Math.max(1,...data.map(d=>d.n));
  const step=w/(data.length-1||1);
  const pts=data.map((d,i)=>[i*step, h-2-(d.n/max)*(h-4)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`${line} L ${w} ${h} L 0 ${h} Z`;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${area}" fill="var(--brand)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--brand-2)" stroke-width="1.3"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="1.8" fill="var(--brand-2)"/>
  </svg>`;
}
function mixBar(rows,colors){
  const total=rows.reduce((s,r)=>s+r.n,0)||1;
  return `<div class="mixbar">${rows.map(r=>
    `<i style="flex-grow:${r.n};background:${colors[r.slug]||'var(--fg-4)'}"
        title="${esc(pretty(r.slug))}: ${r.n} (${Math.round(r.n/total*100)}%)"></i>`).join('')}</div>
   <div class="mixleg">${rows.slice(0,6).map(r=>
    `<div class="r"><span class="sw" style="background:${colors[r.slug]||'var(--fg-4)'}"></span>
     <span>${esc(pretty(r.slug))}</span><span class="v">${r.n}</span></div>`).join('')}</div>`;
}

/* ── Top bar + status ─────────────────────────────────────────────────── */
function renderBar(){
  const names={today:'Today',watch:'Watch',explore:'Explore',learn:'Learn',
    prepare:'Prepare',library:'Library',sources:'Sources'};
  $('#crumb').innerHTML=`<b>${names[S.view]||S.view}</b>`+
    (S.sel?`<span class="sep">/</span><span>detail</span>`:'');

  const h=S.health;
  const ok=h.unevidenced===0;
  // One dot, not two chips. Corpus statistics live in the footer now: they matter, but
  // they are not what the user is looking at, and they were competing with the content.
  $('#barr').innerHTML=`
    <span class="chip" title="${ok?'Every fact carries an evidence span.':h.unevidenced+' facts have no evidence span.'} ${h.healthy} of ${h.active} connectors healthy.">
      <span class="dot" style="background:${ok&&!h.failing?'var(--ok)':'var(--bad)'}"></span>
      ${ok&&!h.failing?'healthy':'check sources'}</span>
    <button class="iconb" id="askbtn" title="Ask the Companion — ⌘J">◧</button>`;
  $('#askbtn').onclick=toggleAsk;
}

/** A filter as a person would say it, not as the query string spells it. */
function describeFilter(k){
  const dim=ALL_DIMS().find(d=>d.key===k);
  const tog=TOGGLES.find(t=>t.key===k);
  if(tog)return tog.label;
  const vals=String(S.F[k]).split(',').filter(Boolean);
  const opts=dim?.opts()||[];
  const names=vals.map(v=>opts.find(o=>o.slug===v)?.name||pretty(v));
  const label=dim?.label||pretty(k);
  return names.length<=2?`${label}: ${names.join(' or ')}`
    :`${label}: ${names[0]} +${names.length-1} more`;
}

function renderStatus(){
  const keys=Object.keys(S.F).filter(k=>S.F[k]!==undefined);
  const chips=keys.map(k=>
    `<span class="fchip">${esc(describeFilter(k))}<button data-x="${esc(k)}" title="Remove">✕</button></span>`).join('');
  $('#status').innerHTML=`
    <span class="s">${keys.length?chips:'<span class="dim">no filters</span>'}</span>
    <span class="right">
      <span class="s corpus dim" title="Corpus size — what has been ingested and extracted">
        ${S.stats.documents} docs · ${S.stats.claims} claims · ${S.stats.events} events</span>
      <span class="s" title="Events per day, last 30 days">${sparkline(S.series,80,13)}
        <span class="dim">30d</span></span>
      <span class="s"><span class="dim">last sync</span> ${ago(S.health.last_sync)}</span>
      <span class="s"><span class="dim">pipeline</span>
        <span class="dot" style="background:${S.health.last_run==='succeeded'?'var(--ok)':'var(--warn)'}"></span>
        ${esc(S.health.last_run||'—')}</span>
      <span class="s hint dim">f filter · j/k move · ⌘K search · ⌘J ask</span>
    </span>`;
  $('#status').querySelectorAll('[data-x]').forEach(btnn=>
    btnn.onclick=()=>{delete S.F[btnn.dataset.x];loadList()});
}

/* ── Filter bar ────────────────────────────────────────────────────────
   Dimensions in the order a consultant actually reaches for them: time, then
   subject, then how much to trust it. Values OR within a dimension, dimensions
   AND together — the only combination that behaves the way people expect.

   Every option carries a live count computed with *this* dimension's own selection
   removed, so the number tells you what adding it would give you. Zero-count
   options stay visible but dimmed: a dead end you can see is better than one you
   discover by clicking. */

const DIMS=[
  {key:'days',label:'Timeframe',single:true,opts:()=>[
    {slug:'7',name:'Last 7 days'},{slug:'30',name:'Last 30 days'},
    {slug:'90',name:'Last quarter'},{slug:'365',name:'Last year'}]},
  {key:'industryIn',label:'Industry',opts:()=>S.facets.industries},
  {key:'entityIn',label:'Company',search:'Type a company name…',opts:()=>S.entityOpts},
  {key:'topicIn',label:'Topic',search:'Search topics…',opts:()=>S.facets.topics},
  // Plain language in front of the taxonomy. Each option maps to a maturity set, so
  // the user picks an outcome ("measured") rather than a vocabulary term.
  {key:'confidence',label:'Confidence',single:true,derived:true,opts:()=>[
    {slug:'measured',name:'Measured outcomes',
     hint:'A figure is claimed and at least one source is not the subject itself.'},
    {slug:'deployed',name:'Actually deployed',
     hint:'In production or at scale — not an announcement or a pilot.'},
    {slug:'corroborated',name:'Independently reported',
     hint:'Reported by someone other than the company it is about.'},
    {slug:'announced',name:'Announcements only',
     hint:'Stated intent with no implementation scope. Useful to see what is noise.'},
    {slug:'reversed',name:'Reversals',
     hint:'Stopped or rolled back — usually the most informative category.'}]},
];

/** The precise taxonomy, behind "More". Nothing is lost, it is just not in the way. */
const MORE_DIMS=[
  {key:'maturityIn',label:'Implementation maturity',opts:()=>S.facets.maturities.map(m=>
    ({...m,name:MAT[m.slug]?.[0]||pretty(m.slug),hint:MAT[m.slug]?.[2]}))},
  {key:'evidenceIn',label:'Evidence strength',opts:()=>S.facets.evidences.map(e=>
    ({...e,name:EV[e.slug]?.[0]||pretty(e.slug)}))},
  {key:'eventTypeIn',label:'Event type',search:'Search types…',
   opts:()=>S.facets.eventTypes.map(e=>({...e,name:pretty(e.name)}))},
  {key:'impactIn',label:'Strategic impact',opts:()=>[
    {slug:'very_high',name:'Very high'},{slug:'high',name:'High'},
    {slug:'moderate',name:'Moderate'},{slug:'low',name:'Low'}]},
  {key:'perspective',label:'Source perspective',single:true,opts:()=>[
    {slug:'independent',name:'Independent only'},{slug:'first_party',name:'First-party only'},
    {slug:'regulatory',name:'Regulator or institution'}]},
  {key:'maxMinutes',label:'Reading time',single:true,opts:()=>[
    {slug:'2',name:'Under 2 min'},{slug:'4',name:'Under 4 min'},{slug:'8',name:'Under 8 min'}]},
];
const ALL_DIMS=()=>[...DIMS,...MORE_DIMS];

/** Confidence is a shorthand, so it expands into the real query params. */
const CONFIDENCE={
  measured:{maturityIn:'QUANTIFIED_BUSINESS_IMPACT,INDEPENDENTLY_VALIDATED_IMPACT',independentOnly:'true'},
  deployed:{maturityIn:'SCALED_DEPLOYMENT,LIMITED_DEPLOYMENT,QUANTIFIED_BUSINESS_IMPACT,INDEPENDENTLY_VALIDATED_IMPACT'},
  corroborated:{independentOnly:'true'},
  announced:{maturityIn:'ANNOUNCED,CONCEPT'},
  reversed:{maturityIn:'DISCONTINUED_OR_REVERSED'},
};

const TOGGLES=[
  {key:'independentOnly',label:'Corroborated',hint:'At least one source that is not the subject itself'},
  {key:'excludeDemo',label:'Hide demo',hint:'Exclude illustrative fixtures — real reporting only'},
];

const sel=k=>{const v=S.F[k];return v===undefined?[]:String(v).split(',').filter(Boolean)};

/** S.F holds what the user chose; this is what the API is actually asked. */
function queryParams(extra={}){
  const {confidence,...rest}={...S.F,...extra};
  return confidence&&CONFIDENCE[confidence]?{...rest,...CONFIDENCE[confidence]}:rest;
}
let openPopKey=null;

/** Counts for one dimension, with that dimension's own selection removed. */
async function dimCounts(dim){
  const opts=dim.opts()||[];
  return Object.fromEntries(await Promise.all(opts.map(async o=>{
    const base={...S.F}; delete base[dim.key];
    const merged=dim.key==='confidence'
      ? {...base,...CONFIDENCE[o.slug]}
      : queryParams({[dim.key]:o.slug});
    if(dim.key!=='confidence')delete merged[dim.key],merged[dim.key]=o.slug;
    const q=new URLSearchParams(Object.entries(merged).filter(([,v])=>v!==undefined));
    return [o.slug,(await api('/api/insights?'+q)).total];
  })));
}

function renderFilters(){
  const bar=$('#filt'); bar.innerHTML='';

  DIMS.forEach(dim=>{
    const chosen=sel(dim.key);
    const g=el('div','fgroup');
    const btn=el('button','fbtn'+(chosen.length?' act':''),
      `<span>${dim.label}</span>${chosen.length
        ? (dim.single||chosen.length===1
            ? `<span style="opacity:.75">· ${esc((dim.opts()||[]).find(o=>o.slug===chosen[0])?.name||chosen[0])}</span>`
            : `<span class="cv">${chosen.length}</span>`)
        : ''}<span class="car">▾</span>`);
    btn.onclick=e=>{e.stopPropagation();togglePop(dim,g)};
    g.append(btn); bar.append(g);
  });

  // "More" holds the precise taxonomy — maturity and evidence included. They are the
  // sharpest filters in the product, so they stay reachable; they are also jargon, so
  // they do not sit in the primary row competing with the content.
  const moreN=MORE_DIMS.reduce((n,d)=>n+(S.F[d.key]!==undefined?1:0),0);
  const mg=el('div','fgroup');
  const mb=el('button','fbtn'+(moreN?' act':''),
    `<span>More</span>${moreN?`<span class="cv">${moreN}</span>`:''}<span class="car">▾</span>`);
  mb.title='Implementation maturity, evidence strength, event type, impact, perspective, reading time';
  mb.onclick=e=>{e.stopPropagation();toggleMore(mg)};
  mg.append(mb); bar.append(mg);

  bar.append(el('div','fsep'));
  TOGGLES.forEach(t=>{
    const on=S.F[t.key]==='true';
    const btn=el('button','fbtn'+(on?' act':''),
      `<span class="bx" style="width:12px;height:12px;border-radius:3px;border:1.5px solid ${
        on?'var(--brand)':'var(--line-3)'};background:${on?'var(--brand)':'transparent'};
        display:grid;place-items:center;font-size:8px;color:#fff">${on?'✓':''}</span>${t.label}`);
    btn.title=t.hint;
    btn.onclick=()=>{on?delete S.F[t.key]:S.F[t.key]='true';loadList()};
    bar.append(btn);
  });

  const n=Object.keys(S.F).length;
  if(n){
    const c=el('button','fclear',n===1?'Clear filter':`Clear ${n} filters`);
    c.onclick=()=>{S.F={};loadList()};
    bar.append(c);
  }
  bar.append(el('div','fcount',
    `<b>${S.total}</b> <span class="of">of ${S.stats.events||''} tracked</span>`));

  // Rebuilding the bar destroys any open popover, so put it back. Without this, picking
  // a value closes the menu and multi-select becomes twelve clicks instead of three.
  document.querySelectorAll('.morepop').forEach(p=>p.remove());
  if(openPopKey==='__more'){openMore(bar.children[DIMS.length])}
  else if(openPopKey){
    const i=DIMS.findIndex(d=>d.key===openPopKey);
    if(i>=0)openPop(DIMS[i],bar.children[i]);
  }
}

function togglePop(dim,group){
  const same=openPopKey===dim.key;
  document.querySelectorAll('.fpop').forEach(p=>p.remove());
  openPopKey=same?null:dim.key;
  if(!same)openPop(dim,group);
}

async function openPop(dim,group){
  group.querySelector('.fpop')?.remove();
  const all=dim.opts()||[];
  const term=(S.popQ[dim.key]||'').toLowerCase();
  const opts=term?all.filter(o=>o.name.toLowerCase().includes(term)
    ||String(o.slug).toLowerCase().includes(term)):all;
  const pop=el('div','fpop');
  pop.innerHTML=`<div class="hd">${dim.label}${dim.single?'':' · any of'}</div>
    ${dim.search?`<div class="fsearch"><span class="ic">⌕</span>
      <input id="fq" placeholder="${esc(dim.search)}" value="${esc(S.popQ[dim.key]||'')}"
        autocomplete="off" spellcheck="false"></div>`:''}
    <div class="bd">${opts.length?opts.map(o=>`
      <button class="fopt" role="checkbox" aria-checked="${sel(dim.key).includes(o.slug)}"
        data-v="${esc(o.slug)}"${o.hint?` title="${esc(o.hint)}"`:''}>
        <span class="bx">${sel(dim.key).includes(o.slug)?'✓':''}</span>
        <span>${esc(o.name)}</span><span class="n" data-c="${esc(o.slug)}">·</span>
      </button>`).join(''):`<div class="fnote">
        No tracked ${dim.label.toLowerCase()} matches “${esc(S.popQ[dim.key]||'')}”.
        ${dim.key==='entityIn'?`<button data-lookup="${esc(S.popQ[dim.key]||'')}"
          style="color:var(--fg);font-weight:600;text-decoration:underline;
          text-underline-offset:2px;margin-top:5px;display:block">
          Search every source for “${esc(S.popQ[dim.key]||'')}” →</button>`:''}
      </div>`}</div>
    ${dim.key==='entityIn'?`<div class="fnote">Companies with no coverage are listed and
      selectable. Choosing one tells you we are not monitoring them yet — which is
      different from nothing having happened.</div>`:''}
    ${dim.single?'':`<div class="ft"><button data-all>Select all${term?' shown':''}</button><button data-none>Clear</button></div>`}`;
  group.append(pop);

  pop.querySelector('[data-lookup]')?.addEventListener('click',e=>{
    e.stopPropagation();
    document.querySelectorAll('.fpop,.morepop').forEach(x=>x.remove());
    openPopKey=null;
    renderLookup(e.target.dataset.lookup);
  });

  const fq=pop.querySelector('#fq');
  if(fq){
    fq.oninput=()=>{S.popQ[dim.key]=fq.value;openPop(dim,group);
      const n=group.querySelector('#fq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
    fq.onclick=e=>e.stopPropagation();
    if(document.activeElement!==fq&&!term)setTimeout(()=>fq.focus(),20);
  }

  pop.querySelectorAll('[data-v]').forEach(b2=>b2.onclick=e=>{
    e.stopPropagation();
    const v=b2.dataset.v; let cur=sel(dim.key);
    if(dim.single)cur=cur.includes(v)?[]:[v];
    else cur=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];
    cur.length?S.F[dim.key]=cur.join(','):delete S.F[dim.key];
    // Single-select closes (the choice is made); multi-select stays open.
    if(dim.single)openPopKey=null;
    loadList();
  });
  pop.querySelector('[data-all]')?.addEventListener('click',e=>{
    e.stopPropagation();S.F[dim.key]=opts.map(o=>o.slug).join(',');loadList()});
  pop.addEventListener('click',e=>e.stopPropagation());
  pop.querySelector('[data-none]')?.addEventListener('click',e=>{
    e.stopPropagation();delete S.F[dim.key];loadList()});

  // Counts arrive after the popover opens — the list must never wait on them.
  const counts=await dimCounts(dim);
  pop.querySelectorAll('[data-c]').forEach(n2=>{
    const c=counts[n2.dataset.c];
    n2.textContent=c??'—';
    n2.closest('.fopt').dataset.zero=String(c===0);
  });
}
function toggleMore(group){
  const same=openPopKey==='__more';
  document.querySelectorAll('.fpop,.morepop').forEach(p=>p.remove());
  openPopKey=same?null:'__more';
  if(!same)openMore(group);
}

async function openMore(group){
  document.querySelectorAll('.morepop').forEach(p=>p.remove());
  const pop=el('div','morepop');
  const r=group.getBoundingClientRect();
  pop.style.top=(r.bottom+5)+'px';
  pop.style.right=Math.max(12,innerWidth-r.right)+'px';
  pop.innerHTML=MORE_DIMS.map(dim=>{
    const chosen=sel(dim.key); const opts=dim.opts()||[];
    return `<div class="morecol"><div class="hd">${dim.label}</div>
      ${opts.map(o=>`<button class="fopt" role="checkbox"
        aria-checked="${chosen.includes(o.slug)}" data-k="${esc(dim.key)}" data-v="${esc(o.slug)}"
        ${o.hint?`title="${esc(o.hint)}"`:''}>
        <span class="bx">${chosen.includes(o.slug)?'✓':''}</span>
        <span>${esc(o.name)}</span>
        <span class="n" data-c="${esc(dim.key)}|${esc(o.slug)}">·</span></button>`).join('')}
    </div>`;
  }).join('');
  pop.addEventListener('click',e=>e.stopPropagation());
  document.body.append(pop);

  pop.querySelectorAll('[data-v]').forEach(b2=>b2.onclick=()=>{
    const dim=MORE_DIMS.find(d=>d.key===b2.dataset.k);
    const v=b2.dataset.v; let cur=sel(dim.key);
    if(dim.single)cur=cur.includes(v)?[]:[v];
    else cur=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];
    cur.length?S.F[dim.key]=cur.join(','):delete S.F[dim.key];
    loadList();
  });

  for(const dim of MORE_DIMS){
    const counts=await dimCounts(dim);
    pop.querySelectorAll(`[data-c^="${dim.key}|"]`).forEach(n2=>{
      const c=counts[n2.dataset.c.split('|')[1]];
      n2.textContent=c??'—';
      n2.closest('.fopt').dataset.zero=String(c===0);
    });
  }
}

/* ── List ─────────────────────────────────────────────────────────────── */
const SORTS={date:'Newest first',impact:'Strategic impact',evidence:'Evidence strength',
  sources:'Most sources',minutes:'Shortest first'};

const WINDOW_LABEL={1:'24 hours',7:'7 days',30:'30 days',90:'quarter',365:'year'};

function renderTool(){
  const w=S.window||{};
  const widenNote=w.widened
    ? `<span class="widen" title="No results in the window you asked for, so it was widened. The results below are older than requested.">
        nothing in ${WINDOW_LABEL[w.requestedWindow]||w.requestedWindow+'d'} — showing
        ${w.window?WINDOW_LABEL[w.window]||w.window+'d':'all time'}</span>`
    : '';
  $('#ltool').innerHTML=`
    <span class="cnt"><b>${S.total}</b> ${S.view==='explore'?'insights':'items'}${
      S.rows.length<S.total?` · showing ${S.rows.length}`:''}</span>
    ${widenNote}
    <select class="sortsel" id="sortsel">
      ${Object.entries(SORTS).map(([k,v])=>
        `<option value="${k}"${S.sort===k?' selected':''}>${v}</option>`).join('')}
    </select>
    <div class="seg">
      <button data-m="rows" class="${S.mode==='rows'?'on':''}">List</button>
      <button data-m="table" class="${S.mode==='table'?'on':''}">Table</button>
    </div>`;
  $('#sortsel').onchange=e=>{S.sort=e.target.value;sortRows();paintList()};
  $('#ltool').querySelectorAll('[data-m]').forEach(btnn=>
    btnn.onclick=()=>{S.mode=btnn.dataset.m;paintList()});
}

function sortRows(){
  const impact={very_high:3,high:2,moderate:1,low:0};
  const evrank={QUANTIFIED_PRIMARY_EVIDENCE:5,UNQUANTIFIED_PRIMARY_EVIDENCE:4,
    MULTIPLE_CREDIBLE_SECONDARY_SOURCES:3,SINGLE_CREDIBLE_SECONDARY_SOURCE:2,
    COMPANY_SELF_REPORTING:1,WEAK_OR_UNVERIFIED_SIGNAL:0};
  const d=r=>new Date(r.event_at||r.first_reported_at||0).getTime();
  const cmp={date:(a,z)=>d(z)-d(a),
    impact:(a,z)=>(impact[z.strategic_impact]??0)-(impact[a.strategic_impact]??0)||d(z)-d(a),
    evidence:(a,z)=>(evrank[z.evidence_strength]??0)-(evrank[a.evidence_strength]??0)||d(z)-d(a),
    sources:(a,z)=>z.source_count-a.source_count||d(z)-d(a),
    minutes:(a,z)=>a.minutes-z.minutes||d(z)-d(a)};
  S.rows.sort(cmp[S.sort]||cmp.date);
}

function rowEdge(r){
  return STRONG.has(r.evidence_strength)?'strong'
    :(r.first_party_only||r.evidence_strength==='WEAK_OR_UNVERIFIED_SIGNAL')?'weak':'';
}

function paintList(){
  renderTool();
  const box=$('#rows'); box.innerHTML='';
  if(!S.rows.length){
    box.append(el('div','empty',
      `<div><div class="t">Nothing matches</div>
       <div>A statement about ${S.health.active||0} monitored sources, not about the world.</div></div>`));
    return;
  }

  if(S.mode==='table'){
    const t=el('table','');
    t.innerHTML=`<thead><tr>
      <th data-s="date">Date <span class="ar">▾</span></th>
      <th data-s="date">Headline</th>
      <th data-s="evidence">Evidence</th>
      <th data-s="date">Maturity</th>
      <th data-s="sources">Src</th>
      <th data-s="minutes">Min</th></tr></thead>
      <tbody>${S.rows.map((r,i)=>`<tr data-i="${i}" class="${S.sel===r.id?'on':''}">
        <td class="mono dim">${dshort(r.event_at||r.first_reported_at)}</td>
        <td class="tt" title="${esc(r.headline)}">${esc(r.headline)}</td>
        <td>${bE(r.evidence_strength)}</td>
        <td>${bM(r.case_maturity)}</td>
        <td class="num dim">${r.source_count}</td>
        <td class="num dim">${r.minutes}</td></tr>`).join('')}</tbody>`;
    box.append(t);
    t.querySelectorAll('thead th[data-s]').forEach(th=>th.onclick=()=>{
      S.sort=th.dataset.s;sortRows();paintList()});
    t.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>select(S.rows[+tr.dataset.i]));
    return;
  }

  S.rows.forEach((r,i)=>{
    const row=el('div','row'+(S.sel===r.id?' on':''));
    row.dataset.ev=rowEdge(r); row.dataset.i=i;
    row.innerHTML=`<span class="edge"></span>
      <span class="rnum">${String(i+1).padStart(2,'0')}</span>
      <div class="rbody">
      <div class="rtop">${bM(r.case_maturity)}${bE(r.evidence_strength)}
        ${r.verification_status==='DISPUTED'?b('Disputed','r'):''}
        ${r.is_demo?b('Demo','r','Illustrative fixture, not real reporting'):''}</div>
      <div class="rtitle">${esc(r.headline)}</div>
      <div class="rmeta">
        ${r.entities?`<span class="co">${esc(String(r.entities).split(',')[0])}</span>`:''}
        <span class="mono">${dshort(r.event_at||r.first_reported_at)}</span>
        <span>${r.source_count} src${r.independent_source_count?` · ${r.independent_source_count} ind`:''}</span>
        <span>${r.minutes}m</span>
      </div></div>
      <div class="racts">
        <button title="Ask about this" data-a="ask">◧</button>
        <button title="Open evidence" data-a="open">↗</button>
      </div>`;
    row.onclick=e=>{
      const a=e.target.closest('[data-a]');
      if(a?.dataset.a==='ask'){openAsk(`What is genuinely new about: ${r.headline}`);return}
      select(r);
    };
    box.append(row);
  });
}

async function loadList(){
  renderStatus();
  $('#rows').innerHTML='<div class="skel"></div><div class="skel"></div>';
  // Ask the server to widen rather than return an empty list: "nothing today" is
  // technically right and practically useless.
  const qs=new URLSearchParams(Object.entries({...queryParams(),widen:'true'})
    .filter(([,v])=>v!==undefined)).toString();
  const {rows,total,window,requestedWindow,widened}=await api('/api/insights?'+qs);
  S.window={window,requestedWindow,widened};
  S.rows=rows; S.total=total; sortRows(); paintList(); renderNav(); renderFilters();
  // Never leave a detail pane showing something the current filter excludes — that is
  // how people end up quoting an item they think is in scope when it is not.
  if(S.pendingInsight){
    const target=rows.find(r=>r.id===S.pendingInsight);
    S.pendingInsight=null;
    if(target){select(target);return}
  }
  const stillThere=rows.some(r=>r.id===S.sel);
  if(rows.length&&!stillThere)select(rows[0]);
  else if(!rows.length){
    S.sel=null;
    $('#detail').innerHTML=`<div class="empty"><div><div class="t">No match</div>
      <div>Nothing in the monitored sources matches this combination.<br>
      That is a statement about our coverage, not about the market.</div></div></div>`;
  }
}

         ['forecasts','Stated forecasts']].map(([k,l])=>
        `<div class="dcell"><div class="k">${l}</div><div class="v num" style="font-size:19px">${w.counts[k]}</div></div>`).join('')}
    </div>
    <div class="blk i"><div class="l">What this deliberately does not do</div>
      <p class="body">It assigns no probabilities, predicts no figures and asserts no outcomes.
      A confidence number this system could not justify would be more damaging than no view at
      all — so it offers the unresolved set, why each matters, and what would resolve it.</p></div>

    ${band('◷','Stated intentions',
      'Things the sources themselves say will happen. FORECAST claims — cited, never presented as fact.',
      'The stated thing happens, or the date passes without it.',
      w.stated,s=>`<div class="blk f" style="border-color:var(--warn)">
        <div class="rtop">${b('Forecast','w')}${bP(s.perspective)}</div>
        <p class="serif" style="margin:5px 0 4px;font-size:13.5px">${esc(s.text)}</p>
        <div class="rmeta"><span>${esc(s.source_name)}</span><span class="mono">${dshort(s.published_at)}</span></div>
      </div>`)}

    ${band('▲','Awaiting scale',
      'Pilots and concepts with no reported expansion. Most pilots do not scale — which of these do is the question.',
      'Scope language in the next report: more sites, more markets, production. Silence past two quarters is itself the answer.',
      w.awaitingScale,e=>`<div class="blk" style="border-color:var(--line-3)">
        <div class="rtop">${bM(e.case_maturity)}${e.first_party_only?b('Self-reported','w'):''}
          ${e.age_days!=null?b(e.age_days+'d old','m'):''}</div>
        <p class="body" style="color:var(--fg);margin-top:5px">${esc(e.title)}</p>
        ${e.entities?`<div class="rmeta">${esc(e.entities)}</div>`:''}</div>`)}

    ${band('◑','Unconfirmed outcomes',
      'Quantified or scaled claims only the subject itself has made. Not doubted — unverified.',
      'A second independent source reporting the same figure, or the baseline and method disclosed.',
      w.unconfirmed,e=>`<div class="blk" style="border-color:var(--warn)">
        <div class="rtop">${bM(e.case_maturity)}${b('No independent source','w')}</div>
        <p class="body" style="color:var(--fg);margin-top:5px">${esc(e.title)}</p></div>`)}

    ${band('⚡','Open disagreements',
      'Sources that cannot both be right. Shown as a conflict rather than averaged into false consensus.',
      'A correction, a third figure, or a disclosed method that reconciles them.',
      w.disputed,x=>`<div class="blk c"><div class="rtop">${b('Sources disagree','r')}</div>
        <p class="body" style="color:var(--fg);margin-top:5px">${esc(x.title)}</p>
        <p class="body" style="color:var(--bad)">${esc(x.why||'')}</p></div>`)}

    ${band('◈','Open hypotheses',
      'Testable propositions derived from the evidence, labelled as interpretation.',
      'Stated inline — each carries the observation that would confirm or refute it.',
      w.hypotheses,h=>`<div class="blk i"><div class="rtop">${b('Hypothesis','w')}</div>
        <p class="body" style="margin-top:5px">${esc(h.text)}</p></div>`)}

    ${band('▼','Recent reversals',
      'Programmes stopped or rolled back — usually more informative than the announcement was.',
      'Already settled. Read the stated reason and check whether it applies to what you track.',
      w.reversals,e=>`<div class="blk c"><div class="rtop">${b('Discontinued','r')}</div>
        <p class="body" style="color:var(--fg);margin-top:5px">${esc(e.title)}</p></div>`)}

    ${band('○','Quiet on your watchlist',
      'Companies you follow that the monitored sources have said little about. A coverage statement, not a claim that nothing is happening.',
      'Adding a source for that company. Silence here is about our monitoring, not about them.',
      w.quiet,q=>`<div class="blk" style="border-color:var(--line-3)">
        <p class="body" style="color:var(--fg)">${esc(q.name)}</p>
        <div class="rmeta">${q.events?q.events+' events':'no events'} ·
          ${q.last_seen?'last seen '+dshort(q.last_seen):'never seen'}</div></div>`)}
  </div>`;
}

/**
 * My client — three rings around one account.
 *
 * The client itself, then its industry with the client's own events removed so it reads
 * as context rather than repetition, then the companies it shares an industry with.
 * That third ring is labelled "compared against", not "competitors": the taxonomy
 * records a shared industry, and inferring rivalry from that would be a claim the data
 * does not support.
 *
 * No client is hard-coded. The account comes from a configured mission where one exists,
 * otherwise from the watchlist, otherwise the user picks.
 */
/**
 * What the corpus knows about a term that matches no tracked entity.
 *
 * The useful answer to "PMI" is not an empty list. It is: no entity carries that name or
 * alias, N events and M claims mention the word, and here is the specific thing that
 * would change that. A gap that names its own remedy is worth more than a blank screen.
 */
async function renderLookup(term){
  const d=$('#detail');
  $('#main').dataset.open='true';
  d.innerHTML='<div class="dwrap"><div class="skel" style="height:120px;border:0"></div></div>';
  const r=await api('/api/lookup?q='+encodeURIComponent(term));

  const nothing=!r.entities.length&&!r.mentions.length&&!r.claimMentions;
  d.innerHTML=`<div class="dwrap">
    <div class="eyebrow">Coverage check</div>
    <div class="dtitle">“${esc(term)}”</div>
    <p class="dlede">${nothing
      ? `Nothing in the monitored sources refers to this. That is a statement about our
         coverage, not about the world — the term may be significant and simply
         unmonitored.`
      : `Found in the corpus. Below is exactly where.`}</p>

    <div class="dgrid">
      <div class="dcell"><div class="k">Matching entities</div>
        <div class="v num">${r.entities.length}</div></div>
      <div class="dcell"><div class="k">Events mentioning it</div>
        <div class="v num">${r.mentions.length}</div></div>
      <div class="dcell"><div class="k">Claims mentioning it</div>
        <div class="v num">${r.claimMentions}</div></div>
    </div>

    ${r.entities.length?`<div class="sec">Tracked entities</div>
      ${r.entities.map(e=>`<div class="blk" style="border-color:var(--line-3)">
        <p class="body" style="color:var(--fg);font-weight:520">${esc(e.name)}
          ${e.legal_name&&e.legal_name!==e.name?`<span class="dim">· ${esc(e.legal_name)}</span>`:''}</p>
        <div class="rmeta">${b(e.n?e.n+' events':'no coverage',e.n?'a':'w')}
          ${e.aliases?`<span>also known as: ${esc(e.aliases)}</span>`:''}</div>
        <div style="margin-top:7px;display:flex;gap:5px">
          <button class="fbtn" data-filter="${esc(e.slug)}">Filter to this company</button>
          <button class="fbtn" data-acc="${esc(e.slug)}">Open as account</button>
        </div>
      </div>`).join('')}`:''}

    ${r.mentions.length?`<div class="sec">Events mentioning “${esc(term)}”</div>
      ${r.mentions.map(m=>`<div class="blk" style="border-color:var(--line-3)">
        <div class="rtop">${bM(m.case_maturity)}${m.evidence_strength?bE(m.evidence_strength):''}</div>
        <p class="body" style="color:var(--fg);margin-top:5px">${esc(m.title)}</p>
        <div class="rmeta"><span class="mono">${dshort(m.event_at||m.first_reported_at)}</span>
          <span>${m.source_count} src</span></div></div>`).join('')}`:''}

    ${nothing?`<div class="sec">What would change this</div>
      <p class="body" style="max-width:70ch">Three routes, in order of effort:</p>
      <ol style="max-width:70ch">
        <li><strong style="color:var(--fg)">Register the company and its newsroom.</strong>
          One entity row, one feed URL, one rights decision. Coverage starts at the next
          pipeline run.</li>
        <li><strong style="color:var(--fg)">Add an alias</strong> if the company is tracked
          under a different name — “${esc(term)}” may be a short form the system has not
          been told about. Aliases already resolve “Zara” to Inditex and “AWS” to Amazon.</li>
        <li><strong style="color:var(--fg)">Ingest a specific URL.</strong> A single article
          or filing, extracted and evidenced like any other source. Useful when the
          question is urgent and the connector is not built yet.</li>
      </ol>
      <div class="blk c" style="margin-top:16px"><div class="l">What this will not do</div>
        <p class="body">It will not answer from general knowledge. A plausible paragraph
        about “${esc(term)}” assembled from memory would be indistinguishable, on screen,
        from a sourced one — and that is the failure this product exists to avoid.</p></div>`
      :''}

    <div class="sec">Ask anyway</div>
    <p class="body" style="margin:0 0 8px">The Companion will tell you what it can and
      cannot support, with the same evidence rules.</p>
    <button class="fu" data-ask="What do the monitored sources say about ${esc(term)}?">
      Ask about “${esc(term)}”</button>
  </div>`;

  d.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{
    S.F={entityIn:btn.dataset.filter};go('explore')});
  d.querySelectorAll('[data-acc]').forEach(btn=>btn.onclick=()=>{
    S.account=btn.dataset.acc;go('account')});
  d.querySelectorAll('[data-ask]').forEach(btn=>btn.onclick=()=>openAsk(btn.dataset.ask));
  d.scrollTop=0;
}

async function renderAccount(d){
  const missions=S.missions||[];
  const picked=S.account
    || missions.find(m=>m.entity_slugs)?.entity_slugs?.split(',')[0]
    || (S.profile.watchlist||[])[0]?.slug;

  const choices=S.entityOpts.slice(0,12);
  const chooser=()=>`<div class="sec">Account</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      ${choices.map(c=>`<button class="fbtn${c.slug===picked?' act':''}" data-acc="${esc(c.slug)}">
        ${esc(c.name)}${c.n?`<span style="opacity:.55"> ${c.n}</span>`:''}</button>`).join('')}
      <button class="fbtn" data-accsearch>Search all companies…</button>
    </div>`;

  if(!picked){
    d.innerHTML=`<div class="dwrap"><div class="eyebrow">My client</div>
      <div class="dtitle">Pick an account</div>
      <p class="dlede">Everything relevant to one client: what changed for them, what
        changed for the companies they are compared against, and what moved in their
        market. If there is nothing on the client, this shows the market instead — there
        is always something worth walking into a meeting with.</p>${chooser()}</div>`;
    wireAccountChooser(d);
    return;
  }

  d.innerHTML='<div class="dwrap"><div class="skel" style="height:150px;border:0"></div></div>';
  const a=await api('/api/account?slug='+encodeURIComponent(picked)
    +(S.accountIndustry?'&industry='+encodeURIComponent(S.accountIndustry):''));
  if(S.view!=='account')return;
  if(a.error){d.innerHTML=`<div class="dwrap"><p class="body">${esc(a.error)}</p>${chooser()}</div>`;
    wireAccountChooser(d);return}

  const evRow=e=>`<div class="row" data-ins="${esc(e.insight_id||'')}"
      data-ev="${STRONG.has(e.evidence_strength)?'strong':(e.first_party_only?'weak':'')}"
      style="grid-template-columns:2px 1fr;border-bottom:1px solid var(--line)">
      <span class="edge"></span><div class="rbody" style="padding:9px 12px">
      <div class="rtop">${bM(e.case_maturity)}${e.evidence_strength?bE(e.evidence_strength):''}
        ${e.first_party_only?b('Self-reported','w'):''}</div>
      <div class="rtitle">${esc(e.title)}</div>
      <div class="rmeta">
        ${e.entities?`<span class="co">${esc(String(e.entities).split(', ').slice(0,2).join(', '))}</span>`:''}
        ${e.topics?`<span>${esc(String(e.topics).split(', ').slice(0,2).map(pretty).join(' · '))}</span>`:''}
        <span class="mono">${dshort(e.event_at||e.first_reported_at)}</span>
        <span>${e.source_count} src</span></div></div></div>`;

  // Every rung, in order, each stating its own scope. The lead is whichever has content.
  const RUNGS=[
    {level:'company',n:'01',title:`On ${a.entity.name}`,
     why:'Events naming the client directly.',
     empty:a.sources.length
       ? `${a.sources.length} source${a.sources.length>1?'s are':' is'} registered for
          ${esc(a.entity.name)} but ${a.sources.length>1?'have':'has'} produced nothing yet.`
       : `No source is registered for ${esc(a.entity.name)}. This silence is about our
          monitoring, not about the company — the fix is a source, not a better query.`,
     events:a.direct},
    {level:'peers',n:'02',title:'Companies it is compared against',
     why:`Sharing ${esc(a.industryNames||'the same industry')}. A shared industry is what the
          taxonomy records — not a competitive relationship, which nobody has asserted.`,
     empty:'No company shares this industry in the taxonomy.',
     events:a.peerEvents},
    {level:'industry',n:'03',title:a.industryNames||'Industry',
     why:`What moved in the industry, with the client\u2019s own events removed so it reads as
          context rather than repetition.`,
     empty:`No events are classified under ${esc(a.industryNames||'this industry')}.`,
     events:a.industryEvents},
    {level:'topics',n:'04',title:'Cross-industry forces',
     why:`Regulation, pricing, supply chain, workforce and technology cut across sectors.
          These keep working when an industry itself has no coverage — they apply to a
          tobacco client as readily as to a retailer.`,
     empty:'No topic-classified events.',
     events:a.topicEvents},
    {level:'market',n:'05',title:'The wider market',
     why:'Highest strategic impact across everything monitored, regardless of sector.',
     empty:'The corpus is empty.',
     events:a.market},
  ];

  const leadIndex=RUNGS.findIndex(r=>r.level===a.leadWith);
  const lead=RUNGS[leadIndex];
  const skipped=RUNGS.slice(0,leadIndex).filter(r=>!r.events.length);

  d.innerHTML=`<div class="dwrap">
    <div class="eyebrow">My client</div>
    <div class="dtitle">${esc(a.entity.name)}</div>
    <p class="dlede">${esc(a.entity.description||'No description stored for this entity.')}</p>

    ${skipped.length?`<div class="blk" style="border-color:var(--warn);margin:18px 0">
      <div class="l" style="color:var(--warn)">Nothing at the level you asked for</div>
      <p class="body">${skipped.map(r=>r.empty).join(' ')}
      So this leads with <strong style="color:var(--fg)">${esc(lead.title.toLowerCase())}</strong>
      instead. Every level below is still shown, and each says what it is.</p></div>`:''}

    <div class="dgrid">
      ${RUNGS.map(r=>`<div class="dcell">
        <div class="k">${esc(r.title).replace(/^On /,'')}</div>
        <div class="v num" style="font-size:19px;${r.level===a.leadWith?'':'color:var(--fg-3)'}">
          ${r.events.length}</div></div>`).join('')}
    </div>

    ${chooser()}

    <div class="sec">Industry</div>
    <p class="body" style="margin:0 0 8px">
      ${a.industryIsInferred
        ? `No industry is recorded for ${esc(a.entity.name)}, so this uses the industries on
           your own profile. Pick a different one and every level below re-scopes.`
        : `Recorded as ${esc(a.industryNames)}. Override it if the engagement sits elsewhere.`}</p>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      ${(a.allIndustries||[]).map(i=>`<button
        class="fbtn${a.industries.includes(i.slug)?' act':''}" data-ind="${esc(i.slug)}">
        ${esc(i.name)}</button>`).join('')}
      ${S.accountIndustry?`<button class="fclear" data-ind="">Reset</button>`:''}
    </div>

    ${RUNGS.map(r=>`
      <div class="sec"><span class="mono" style="color:var(--fg-4)">${r.n}</span> ${esc(r.title)}
        <span class="b m">${r.events.length}</span></div>
      <p class="body" style="margin:0 0 10px;max-width:72ch">${r.why}</p>
      ${r.events.length
        ? `<div style="border-top:1px solid var(--line)">${r.events.slice(0,10).map(evRow).join('')}</div>`
        : `<p class="body dim" style="margin-bottom:4px">${r.empty}</p>`}
    `).join('')}

    ${a.related.length?`<div class="sec">Stated relationships</div>
      <p class="body" style="margin:0 0 8px">Each comes from a claim in a document, not from inference.</p>
      ${a.related.map(r=>`<div class="rmeta" style="margin-bottom:6px">
        ${b(pretty(r.relationship),'a')}<span class="co">${esc(r.name)}</span>
        ${r.note?`<span>${esc(r.note)}</span>`:''}</div>`).join('')}`:''}

    <div class="sec">Ask about this account</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      ${[`What changed for ${a.entity.name} recently?`,
         `What is moving in ${a.industryNames||'this market'} that ${a.entity.name} has not addressed?`,
         `Challenge the claim that ${a.entity.name} is ahead on AI`,
         `Prepare me for a meeting with ${a.entity.name}`]
        .map(qq=>`<button class="fu" data-ask="${esc(qq)}">${esc(qq)}</button>`).join('')}
    </div>

    <div class="blk i" style="margin-top:22px"><div class="l">What this view cannot do</div>
      <p class="body">It cannot tell you the client\u2019s internal position, their financials
      beyond what is published, or what they think. It reports what monitored public sources
      have said, widens its scope until it has something, and names the level it is
      speaking at so you never mistake market context for news about your client.</p></div>
  </div>`;

  wireAccountChooser(d);
  d.querySelectorAll('[data-ind]').forEach(btn=>btn.onclick=()=>{
    S.accountIndustry=btn.dataset.ind||null; renderAccount(d)});
  d.querySelectorAll('[data-ins]').forEach(r=>r.onclick=()=>{
    const id=r.dataset.ins; if(!id)return;
    S.pendingInsight=id; go('today');
  });
  d.querySelectorAll('[data-ask]').forEach(btn=>btn.onclick=()=>openAsk(btn.dataset.ask));
  d.scrollTop=0;
}

function wireAccountChooser(d){
  d.querySelectorAll('[data-acc]').forEach(btn=>btn.onclick=()=>{
    S.account=btn.dataset.acc; renderAccount($('#detail'));
  });
  d.querySelector('[data-accsearch]')?.addEventListener('click',()=>openPal(''));
}
