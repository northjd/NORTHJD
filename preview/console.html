/* ── Command palette ─────────────────────────────────────────────────── */
let pal={open:false,cur:0,items:[]};
function openPal(prefill=''){
  if(pal.open)return; pal.open=true;
  const scrim=el('div','scrim'); scrim.id='scrim';
  scrim.innerHTML=`<div class="pal">
    <div class="palin"><span class="dim">⌕</span>
      <input id="palq" placeholder="Jump to a company, filter, or type ? to ask…" autocomplete="off">
      <span class="palmode" id="palmode">Navigate</span></div>
    <div class="palres" id="palres"></div>
    <div class="palfoot"><span>↑↓ move</span><span>⏎ select</span><span>? ask instead</span><span>esc close</span></div>
  </div>`;
  document.body.append(scrim);
  scrim.onclick=e=>{if(e.target===scrim)closePal()};
  const q=$('#palq'); q.value=prefill; q.focus();
  q.oninput=()=>palRender(q.value);
  q.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();pal.cur=Math.min(pal.cur+1,pal.items.length-1);palPaint()}
    if(e.key==='ArrowUp'){e.preventDefault();pal.cur=Math.max(pal.cur-1,0);palPaint()}
    if(e.key==='Enter'){e.preventDefault();pal.items[pal.cur]?.run()}
    if(e.key==='Escape')closePal();
  };
  palRender(prefill);
}
function closePal(){pal.open=false;$('#scrim')?.remove()}

function palRender(q){
  const s=q.trim(); const ask=s.startsWith('?');
  $('#palmode').textContent=ask?'Ask':'Navigate';
  const items=[];
  if(ask){
    const question=s.slice(1).trim();
    if(question)items.push({grp:'Ask the Companion',ic:'◧',label:question,sub:'⏎',
      run:()=>{closePal();openAsk(question)}});
  } else {
    const m=s.toLowerCase();
    const hit=t=>!m||String(t).toLowerCase().includes(m);
    NAV.flatMap(g=>g.items).filter(i=>hit(i.label)).forEach(i=>
      items.push({grp:'Go to',ic:i.ic,label:i.label,run:()=>{closePal();go(i.v)}}));
    S.entityOpts.filter(c=>hit(c.name)).slice(0,8).forEach(c=>
      items.push({grp:'Companies',ic:'▣',label:c.name,
        sub:c.n?c.n+' events':'no coverage',
        run:()=>{closePal();S.F={entityIn:c.slug};go('explore')}}));
    S.entityOpts.filter(c=>hit(c.name)).slice(0,4).forEach(c=>
      items.push({grp:'Open as account',ic:'◆',label:c.name,
        run:()=>{closePal();S.account=c.slug;go('account')}}));
    (S.palette?.industries||[]).filter(i=>hit(i.name)).slice(0,5).forEach(i=>
      items.push({grp:'Industries',ic:'◱',label:i.name,
        run:()=>{closePal();S.F={industryIn:i.slug};go('explore')}}));
    (S.palette?.topics||[]).filter(t=>hit(t.name)).slice(0,6).forEach(t=>
      items.push({grp:'Topics',ic:'◇',label:t.name,
        run:()=>{closePal();S.F={topicIn:t.slug};go('explore')}}));
    // Filter values are searchable too, so ⌘K can apply a filter directly. Typing
    // "pilot" should narrow the corpus, not just look for a page called Pilot.
    if(m)ALL_DIMS().forEach(dim=>(dim.opts()||[]).filter(o=>hit(o.name)).slice(0,3).forEach(o=>
      items.push({grp:'Apply a filter',ic:'⊟',label:`${dim.label}: ${o.name}`,
        sub:o.n!=null?String(o.n):'',
        run:()=>{closePal();
          const cur=dim.single?[]:sel(dim.key);
          S.F[dim.key]=[...new Set([...cur,o.slug])].join(',');
          go(S.view==='today'?'explore':S.view);}})));
    (S.suggest||[]).filter(v=>hit(v.name)).slice(0,6).forEach(v=>
      items.push({grp:'Saved views',ic:'★',label:v.name,sub:String(v.count??''),
        run:()=>{closePal();S.F={...v.set};go('explore')}}));
    (S.palette?.units||[]).filter(u=>hit(u.title)).slice(0,4).forEach(u=>
      items.push({grp:'Learning',ic:'▤',label:u.title,run:()=>{closePal();go('learn')}}));
    if(s){
      items.push({grp:'Coverage',ic:'⌕',label:`Check coverage for “${s}”`,
        sub:'what we have, and what we do not',
        run:()=>{closePal();renderLookup(s)}});
      items.push({grp:'Ask the Companion',ic:'◧',label:`Ask: “${s}”`,sub:'or prefix ?',
        run:()=>{closePal();openAsk(s)}});
    }
  }
  pal.items=items; pal.cur=0; palPaint();
}
function palPaint(){
  const box=$('#palres'); if(!box)return; box.innerHTML='';
  if(!pal.items.length){box.innerHTML='<div class="palgrp">No matches</div>';return}
  let grp='';
  pal.items.forEach((it,i)=>{
    if(it.grp!==grp){grp=it.grp;box.append(el('div','palgrp',grp))}
    const r=el('div','palrow'+(i===pal.cur?' cur':''),
      `<span class="ic">${it.ic}</span><span>${esc(it.label)}</span>${it.sub?`<span class="sub">${esc(it.sub)}</span>`:''}`);
    r.onmouseenter=()=>{pal.cur=i;palPaint()};
    r.onclick=()=>it.run();
    box.append(r);
  });
}

/* ── Ask — a docked pane ─────────────────────────────────────────────── */
const MODES=[['brief_me','Brief'],['explain_it','Explain'],['explore_it','Explore'],
  ['prepare_me','Prepare'],['challenge_me','Challenge'],['teach_me','Teach'],['capture_reflect','Capture']];
let askOpen=false,askMode='explore_it',askBusy=false,rec=null;

function toggleAsk(){askOpen?closeAsk():openAsk()}
function closeAsk(){askOpen=false;$('#askpane')?.remove();try{rec?.stop()}catch{}}
function openAsk(prefill=''){
  if(!askOpen){
    askOpen=true;
    const p=el('aside','askpane'); p.id='askpane';
    p.innerHTML=`<div class="askhd"><span class="eyebrow">Companion</span>
        <span class="b m" id="genlabel">extractive</span>
        <button class="iconb" id="askclose" style="margin-left:auto">✕</button></div>
      <div class="askbd" id="thread">
        <p class="body">Ask about anything in the monitored sources. Answers separate verified facts
        from interpretation, cite the exact passage behind every factual line, and say so plainly
        when the evidence is not there.</p></div>
      <div class="askft">
        <div class="modes" id="modes"></div>
        <div class="askrow">
          <textarea class="ask" id="q" rows="1" aria-label="Ask the Companion"></textarea>
          <button class="ib" id="mic" title="Speak — transcription happens in your browser">🎙</button>
          <button class="ib pri" id="send" disabled title="Ask">↑</button>
        </div>
        <div class="warnstrip">Do not enter confidential client or company information unless this
          workspace has been explicitly approved for it.</div>
      </div>`;
    document.body.append(p);
    $('#askclose').onclick=closeAsk;
    const mb=$('#modes');
    MODES.forEach(([k,l])=>{
      const btn=el('button','mode'+(askMode===k?' on':''),l);
      btn.onclick=()=>{askMode=k;[...mb.children].forEach((c,i)=>c.classList.toggle('on',MODES[i][0]===k))};
      mb.append(btn);
    });
    const q=$('#q');
    q.oninput=()=>{$('#send').disabled=!q.value.trim()||askBusy;
      q.style.height='auto';q.style.height=Math.min(120,q.scrollHeight)+'px'};
    q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doAsk()}};
    $('#send').onclick=()=>doAsk();
    setupMic();
  }
  if(prefill){$('#q').value=prefill;$('#send').disabled=false;doAsk()}
  else setTimeout(()=>$('#q')?.focus(),60);
}
function setupMic(){
  const btn=$('#mic'); const Impl=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Impl){btn.disabled=true;btn.style.opacity=.3;
    btn.title='Voice input is unavailable in this browser. Typing uses the same answering path and the same evidence model.';return}
  btn.onclick=()=>{
    rec=new Impl(); rec.lang='en-GB'; rec.interimResults=false;
    btn.classList.add('live');
    rec.onresult=e=>{btn.classList.remove('live');
      $('#q').value=e.results[0][0].transcript;$('#send').disabled=false;doAsk(true)};
    rec.onerror=()=>{btn.classList.remove('live');
      $('#thread').append(el('div','warnstrip','Voice input failed. Check microphone permission, or type instead.'))};
    rec.onend=()=>btn.classList.remove('live');
    rec.start();
  };
}
async function doAsk(spoken){
  const q=$('#q'); const question=q.value.trim();
  if(!question||askBusy)return;
  askBusy=true; $('#send').disabled=true;
  const th=$('#thread');
  th.append(el('div','turn me',esc(question)));
  q.value=''; q.style.height='auto';
  const wait=el('div','thinking','<i></i><i></i><i></i>'); th.append(wait); th.scrollTop=th.scrollHeight;

  let r;
  try{r=await api('/api/ask',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({question,mode:askMode})})}
  catch{wait.remove();th.append(el('div','warnstrip','Network error. The Companion did not answer.'));askBusy=false;return}
  wait.remove();

  const cite=i=>{const c=r.citations[i];
    return c?`<sup><a href="${esc(c.sourceUrl||'#')}" target="_blank" rel="noopener"
      title="${esc(c.sourceName)} — ${esc(c.documentTitle)}">[${i+1}]</a></sup>`:''};

  const a=el('div','turn');
  a.innerHTML=`<div class="ans">
    <div class="anshd">${b(pretty(r.mode),'a')}<span>as of ${dshort(r.asOf)}</span>
      ${r.insufficient?b('Insufficient evidence','r'):''}
      ${r.citations.length?`<span>· ${r.citations.length} citations</span>`:''}</div>
    <p class="serif" style="font-size:13.5px;margin:0 0 4px">${esc(r.directAnswer)}</p>
    ${r.facts.length?`<div class="blk f"><div class="l">Verified facts</div><ol>
      ${r.facts.map(f=>`<li style="color:var(--fg)">${esc(f.text)}${f.citationIndexes.map(cite).join('')}</li>`).join('')}</ol></div>`:''}
    ${r.interpretations.length?`<div class="blk i"><div class="l">Interpretation</div><ul>
      ${r.interpretations.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
    ${r.hypotheses.length?`<div class="blk i"><div class="l">Hypotheses</div><ul>
      ${r.hypotheses.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
    ${r.counterEvidence.length?`<div class="blk c"><div class="l">Counter-evidence</div><ul>
      ${r.counterEvidence.map(t=>`<li>${esc(t.text)}</li>`).join('')}</ul></div>`:''}
    ${r.starters.length?`<div class="blk i"><div class="l">Questions you could ask</div><ol>
      ${r.starters.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`:''}
    ${r.unknowns.length?`<div class="blk" style="border-color:var(--line-3)">
      <div class="l" style="color:var(--fg-4)">What this does not tell you</div><ul>
      ${r.unknowns.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
    ${r.citations.length?`<div class="sec" style="margin:12px 0 6px">Citations</div><ol>
      ${r.citations.map((c,i)=>`<li style="font-size:11px">${esc(c.documentTitle)} —
        ${esc(c.sourceName)} · ${dshort(c.publishedAt)} · ${esc(pretty(c.evidenceStrength))}</li>`).join('')}</ol>`:''}
    ${r.followUps.length?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;
      padding-top:9px;border-top:1px solid var(--line)">
      ${r.followUps.map(f=>`<button class="fu">${esc(f)}</button>`).join('')}</div>`:''}
  </div>`;
  th.append(a);
  a.querySelectorAll('.fu').forEach(btnn=>btnn.onclick=()=>{$('#q').value=btnn.textContent;doAsk()});
  th.scrollTop=th.scrollHeight;
  askBusy=false;
  if(spoken&&'speechSynthesis'in window){
    const u=new SpeechSynthesisUtterance([r.directAnswer,...r.facts.map(f=>f.text)].join(' ').slice(0,650));
    u.lang='en-GB'; speechSynthesis.speak(u);
  }
}

/* ── Keyboard ─────────────────────────────────────────────────────────── */
addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.open?closePal():openPal();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='j'){e.preventDefault();toggleAsk();return}
  if(e.key==='Escape'){
    if(pal.open)closePal();
    else if(document.querySelector('.fpop,.morepop')){
      document.querySelectorAll('.fpop,.morepop').forEach(p=>p.remove());openPopKey=null}
    else if(askOpen)closeAsk();
    return}
  if(e.key.toLowerCase()==='f'&&!e.metaKey&&!e.ctrlKey){
    e.preventDefault();$('.filt .fbtn')?.click();return}
  if(typing)return;
  if(e.key==='/'){e.preventDefault();openPal();return}
  if(e.key==='?'){e.preventDefault();openPal('?');return}
  const n=['today','watch','explore','account','learn','prepare','library'][+e.key-1];
  if(n){go(n);return}
  if(['j','k'].includes(e.key)&&S.rows.length){
    e.preventDefault();
    const i=S.rows.findIndex(r=>r.id===S.sel);
    const next=e.key==='j'?Math.min(i+1,S.rows.length-1):Math.max(i-1,0);
    select(S.rows[next]);
    document.querySelector('.row.on,tbody tr.on')?.scrollIntoView({block:'nearest'});
  }
});
